AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Robotics STEM Lab API backend

Parameters:
  GeminiModel:
    Type: String
    Default: gemini-3.5-flash
  BackendSecretsName:
    Type: String
    Default: robotics-lab/backend
    Description: Name or ARN of the Secrets Manager secret containing the backend credentials.
  SesFromEmail:
    Type: String
    Default: ""
    Description: Verified SES sender email address for payment receipts.
  PaymentReceiptAdminEmail:
    Type: String
    Default: Business@alberotechnologies.com
    Description: Business email address that receives a blind copy of payment receipts.

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 29
    MemorySize: 1024
    Architectures:
      - x86_64
    Environment:
      Variables:
        CORS_ALLOWED_ORIGINS: !Sub "https://${FrontendDistribution.DomainName}"
        GEMINI_MODEL: !Ref GeminiModel
        SES_FROM_EMAIL: !Ref SesFromEmail
        PAYMENT_RECEIPT_ADMIN_EMAIL: !Ref PaymentReceiptAdminEmail
        GEMINI_API_KEY: !Sub "{{resolve:secretsmanager:${BackendSecretsName}:SecretString:GEMINI_API_KEY}}"
        FIREBASE_PROJECT_ID: !Sub "{{resolve:secretsmanager:${BackendSecretsName}:SecretString:FIREBASE_PROJECT_ID}}"
        FIREBASE_SERVICE_ACCOUNT_BASE64: !Sub "{{resolve:secretsmanager:${BackendSecretsName}:SecretString:FIREBASE_SERVICE_ACCOUNT_BASE64}}"
        RAZORPAY_KEY_ID: !Sub "{{resolve:secretsmanager:${BackendSecretsName}:SecretString:RAZORPAY_KEY_ID}}"
        RAZORPAY_KEY_SECRET: !Sub "{{resolve:secretsmanager:${BackendSecretsName}:SecretString:RAZORPAY_KEY_SECRET}}"
        ADZUNA_APP_ID: !Sub "{{resolve:secretsmanager:${BackendSecretsName}:SecretString:ADZUNA_APP_ID}}"
        ADZUNA_APP_KEY: !Sub "{{resolve:secretsmanager:${BackendSecretsName}:SecretString:ADZUNA_APP_KEY}}"

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        Description: Private access from CloudFront to the frontend bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        Restrictions:
          GeoRestriction:
            RestrictionType: none
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  BackendHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${FrontendDistribution.DomainName}"
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        MaxAge: 600

  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: server/lambda.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesFromEmail}"
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendHttpApi
            Path: /health
            Method: GET
        GenerateInterview:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendHttpApi
            Path: /api/generate-interview
            Method: POST
        SkillAssessment:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendHttpApi
            Path: /api/skill-assessment
            Method: POST
        ResearchAssistant:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendHttpApi
            Path: /api/research-assistant
            Method: POST
        ResumeAssistant:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendHttpApi
            Path: /api/resume-assistant
            Method: POST
        BillingUsage:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendHttpApi
            Path: /api/billing/usage
            Method: GET
        BillingOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendHttpApi
            Path: /api/billing/order
            Method: POST
        VerifyPayment:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendHttpApi
            Path: /api/billing/verify-payment
            Method: POST
        IndiaJobs:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendHttpApi
            Path: /api/jobs/india
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - server/lambda.js
        Format: esm
        Target: es2022
        Minify: true
        External:
          - firebase-admin
          - firebase-admin/*
        OutExtension:
          - .js=.mjs

Outputs:
  FrontendUrl:
    Description: CloudFront URL for the static frontend.
    Value: !Sub "https://${FrontendDistribution.DomainName}"
  FrontendBucketName:
    Description: Private S3 bucket for the built frontend files.
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Description: CloudFront distribution ID for cache invalidations.
    Value: !Ref FrontendDistribution
  BackendApiUrl:
    Description: API Gateway endpoint for the backend.
    Value: !Sub "https://${BackendHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  BackendFunctionName:
    Description: Lambda function where backend-only environment variables must be configured.
    Value: !Ref BackendFunction
