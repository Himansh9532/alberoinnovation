[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/generate-interview"
  to = "/.netlify/functions/generate-interview"
  status = 200

[[redirects]]
  from = "/api/skill-assessment"
  to = "/.netlify/functions/skill-assessment"
  status = 200

[[redirects]]
  from = "/api/billing/usage"
  to = "/.netlify/functions/billing-usage"
  status = 200

[[redirects]]
  from = "/api/billing/order"
  to = "/.netlify/functions/billing-order"
  status = 200

[[redirects]]
  from = "/api/billing/verify-payment"
  to = "/.netlify/functions/billing-verify-payment"
  status = 200

[[redirects]]
  from = "/api/jobs/india"
  to = "/.netlify/functions/jobs-india"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200